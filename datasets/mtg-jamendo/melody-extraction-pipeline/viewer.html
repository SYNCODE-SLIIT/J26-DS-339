<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTG-Jamendo melody extraction</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;color:#20251f;background:#f5f5f0}
main{padding:1.3rem;background:#fff;border:1px solid #d7ded3;border-radius:14px}
h1{font-size:1.6rem;margin-bottom:.2rem}p{color:#525b50}
label{display:block;font-weight:650;margin-top:1rem}select,input,button{font:inherit;padding:.55rem;border:1px solid #acb6a7;border-radius:7px;background:#fff;color:inherit}
select,input{width:100%;box-sizing:border-box}button{cursor:pointer}button:hover{background:#e8efe6}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
.buttons{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}audio{width:100%}
.midi-player{display:flex;align-items:center;gap:12px;min-height:54px;box-sizing:border-box;padding:0 16px;margin-top:.25rem;background:#f1f3f4;border-radius:100px;color:#202124;font:14px system-ui,sans-serif}
.midi-player button{display:grid;place-items:center;flex:none;width:28px;height:32px;padding:0;border:0;background:transparent;color:inherit}
.midi-player button:hover{background:#e1e4e6;border-radius:50%}
.midi-player svg{width:20px;height:20px;fill:currentColor}
.midi-player button[data-playing="true"] .icon-play,.midi-player button[data-playing="false"] .icon-pause,.midi-player button[data-muted="true"] .icon-volume,.midi-player button[data-muted="false"] .icon-muted{display:none}
.midi-player .midi-time{font-variant-numeric:tabular-nums;white-space:nowrap}
.midi-player input[type="range"]{appearance:none;-webkit-appearance:none;flex:1;min-width:36px;width:auto;height:4px;padding:0;border:0;border-radius:3px;background:linear-gradient(to right,#202124 var(--progress,0%),#777 var(--progress,0%));cursor:pointer}
.midi-player input[type="range"]::-webkit-slider-thumb{appearance:none;width:10px;height:10px;border-radius:50%;background:#202124}
.midi-player input[type="range"]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:#202124}
.midi-player #midiVolume{flex:none;width:76px;background:linear-gradient(to right,#202124 var(--progress,100%),#777 var(--progress,100%))}
@media(max-width:550px){.midi-player{gap:8px;padding:0 10px}.midi-player #midiVolume{width:45px}}
button:disabled{cursor:not-allowed;opacity:.5}
.small{font-size:.9rem;color:#566053}a{margin-right:.8rem;color:#245c40}
</style>
<h1>Full-song melody comparison</h1>
<p id="status">Loading extracted songs…</p>
<main>
  <div class="grid">
    <div><label for="search">Find track ID</label><input id="search" placeholder="Search extracted songs"></div>
    <div><label for="song">Song</label><select id="song"></select></div>
  </div>
  <label for="method">Melody</label>
  <select id="method">
    <option value="combined">Combined · GAME vocal then SheetSage2 instrumental</option>
    <option value="game_vocal">GAME vocal · one octave higher</option>
    <option value="sheetsage2_instrumental">SheetSage2 instrumental</option>
  </select>
  <p id="detail" class="small"></p>
  <label for="original">Original full song</label>
  <audio id="original" controls preload="metadata"></audio>
  <label for="midiSeek">Extracted MIDI melody</label>
  <div class="midi-player">
    <button id="midiPlay" type="button" aria-label="Play MIDI melody" data-playing="false" disabled>
      <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
    </button>
    <span class="midi-time"><span id="midiCurrent">0:00</span> / <span id="midiDuration">0:00</span></span>
    <input id="midiSeek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek extracted MIDI melody">
    <button id="midiMute" type="button" aria-label="Mute MIDI melody" data-muted="false">
      <svg class="icon-volume" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm12 3a3 3 0 0 0-2-2.82v5.64A3 3 0 0 0 15 12zm-2-8v2.06a6 6 0 0 1 0 11.88V20a8 8 0 0 0 0-16z"/></svg>
      <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm12.6 1.6-1.4 1.4 1.4 1.4-1.4 1.4-1.4-1.4-1.4 1.4-1.4-1.4 1.4-1.4-1.4-1.4 1.4-1.4 1.4 1.4 1.4-1.4z"/></svg>
    </button>
    <input id="midiVolume" type="range" min="0" max="1" step="0.01" value="1" aria-label="MIDI volume">
  </div>
  <div class="buttons">
    <button id="playTogether" disabled>Play both from start</button>
  </div>
  <p class="small">The MIDI plays as a simple sine tone. Drag its bar to seek; when playing both, this seeks the original song too.</p>
  <p><a id="midi">MIDI</a><a id="json">JSON</a><a id="csv">CSV</a></p>
</main>
<script>
const $ = id => document.getElementById(id);
const methods = ['combined','game_vocal','sheetsage2_instrumental'];
let catalog = [], selectedId = '', notes = [], context = null, masterGain = null, ticker = null, oscillators = [];
let requestToken = 0;
let midiPosition = 0, midiDuration = 0, midiPlaying = false, withOriginal = false;
let playbackStartTime = 0, playbackStartPosition = 0, nextNote = 0, dragging = false;
let midiVolume = 1, lastAudibleVolume = 1;

function formatTime(seconds) {
  const value = Math.max(0, Math.floor(seconds || 0));
  return `${Math.floor(value / 60)}:${String(value % 60).padStart(2, '0')}`;
}
function showPlayer() {
  $('midiSeek').max = String(midiDuration);
  if (!dragging) $('midiSeek').value = String(midiPosition);
  $('midiSeek').style.setProperty('--progress', `${midiDuration ? 100 * Number($('midiSeek').value) / midiDuration : 0}%`);
  $('midiCurrent').textContent = formatTime(dragging ? Number($('midiSeek').value) : midiPosition);
  $('midiDuration').textContent = formatTime(midiDuration);
  $('midiPlay').dataset.playing = String(midiPlaying);
  $('midiPlay').setAttribute('aria-label', `${midiPlaying ? 'Pause' : 'Play'} MIDI melody`);
  $('midiPlay').disabled = !notes.length;
  $('playTogether').disabled = !notes.length;
}
function showVolume() {
  $('midiVolume').value = String(midiVolume);
  $('midiVolume').style.setProperty('--progress', `${100 * midiVolume}%`);
  $('midiMute').dataset.muted = String(midiVolume === 0);
  $('midiMute').setAttribute('aria-label', midiVolume === 0 ? 'Unmute MIDI melody' : 'Mute MIDI melody');
  if (masterGain && context) masterGain.gain.setValueAtTime(midiVolume, context.currentTime);
}
function stopAudioEngine() {
  if (ticker) clearInterval(ticker);
  ticker = null;
  for (const oscillator of oscillators) { try { oscillator.stop(); } catch {} }
  oscillators = [];
  if (context) context.close();
  context = null;
  masterGain = null;
}
function pauseMidi() {
  if (midiPlaying && context) {
    midiPosition = Math.min(midiDuration, playbackStartPosition + Math.max(0, context.currentTime - playbackStartTime));
  }
  stopAudioEngine();
  if (withOriginal) $('original').pause();
  midiPlaying = false;
  withOriginal = false;
  showPlayer();
}
async function loadSelection() {
  ++requestToken;
  pauseMidi(); $('original').pause();
  notes = []; midiPosition = 0; dragging = false;
  const song = catalog.find(item => item.track_id === $('song').value);
  if (!song) { midiDuration = 0; showPlayer(); return; }
  selectedId = song.track_id;
  midiDuration = Number(song.duration_sec) || 0;
  showPlayer();
  $('original').src = song.audio;
  for (const option of $('method').options) option.disabled = !(song.available?.[option.value] ?? true);
  if ($('method').selectedOptions[0].disabled) {
    $('method').value = methods.find(method => song.available[method]);
  }
  const method = $('method').value;
  $('midi').href = song.midi[method]; $('json').href = song.notes[method]; $('csv').href = song.csv[method];
  $('detail').textContent = `Track ${song.mtg_track_id} · artist ${song.artist_id || 'unknown'} · ${song.split_0 || 'no split-0 label'} · ${song.counts[method]} notes · ${Math.round(song.duration_sec)} seconds${song.status === 'complete' ? '' : ` · ${song.status === 'failed' ? 'extraction failed' : 'extraction in progress'}`}`;
  const token = ++requestToken;
  const response = await fetch(song.notes[method]);
  if (!response.ok) throw new Error(`Cannot load notes: ${response.status}`);
  const data = await response.json();
  if (token === requestToken) { notes = data.notes; showPlayer(); }
}
async function refreshCatalog() {
  try {
    const response = await fetch(`catalog.json?t=${Date.now()}`, {cache:'no-store'});
    if (!response.ok) throw new Error(`Catalog HTTP ${response.status}`);
    const data = await response.json();
    const oldId = $('song').value;
    const oldAvailable = catalog.find(item => item.track_id === oldId)?.available;
    const oldStatus = catalog.find(item => item.track_id === oldId)?.status;
    const query = $('search').value.trim();
    catalog = data.tracks;
    const shown = catalog.filter(item => !query || item.track_id.includes(query) || item.mtg_track_id.includes(query));
    $('song').replaceChildren(...shown.map(item => new Option(
      `${item.mtg_track_id}${item.status === 'complete' ? '' : item.status === 'failed' ? ' · failed' : ' · in progress'}`, item.track_id)));
    if (shown.some(item => item.track_id === oldId)) $('song').value = oldId;
    else if (shown.some(item => item.track_id === selectedId)) $('song').value = selectedId;
    const inProgress = catalog.filter(item => item.status === 'partial').length;
    const failed = catalog.filter(item => item.status === 'failed').length;
    $('status').textContent = `${data.completed_count} fully extracted · ${inProgress} in progress${failed ? ` · ${failed} failed` : ''}. The list updates as extraction continues.`;
    const selected = catalog.find(item => item.track_id === $('song').value);
    if (selected && (selected.track_id !== selectedId ||
        selected.status !== oldStatus || JSON.stringify(selected.available) !== JSON.stringify(oldAvailable))) await loadSelection();
  } catch (error) {
    $('status').textContent = `Could not load the catalog. Open this page through the local HTTP server described in README.md. ${error}`;
  }
}
function startMidi(playOriginal) {
  if (!notes.length) return;
  stopAudioEngine();
  if (midiPosition >= midiDuration) midiPosition = 0;
  $('original').pause();
  withOriginal = playOriginal;
  if (withOriginal) { $('original').currentTime = midiPosition; $('original').play(); }
  context = new AudioContext();
  masterGain = context.createGain();
  masterGain.gain.value = midiVolume;
  masterGain.connect(context.destination);
  playbackStartTime = context.currentTime + 0.12;
  playbackStartPosition = midiPosition;
  nextNote = notes.findIndex(note => note.offset_sec > midiPosition);
  if (nextNote < 0) nextNote = notes.length;
  midiPlaying = true;
  function schedule() {
    if (!context) return;
    midiPosition = Math.min(midiDuration, playbackStartPosition + Math.max(0, context.currentTime - playbackStartTime));
    const ahead = midiPosition + 0.8;
    while (nextNote < notes.length && notes[nextNote].onset_sec <= ahead) {
      const note = notes[nextNote++];
      const onset = playbackStartTime + note.onset_sec - playbackStartPosition;
      const offset = playbackStartTime + note.offset_sec - playbackStartPosition;
      if (offset <= context.currentTime) continue;
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.value = 440 * Math.pow(2, (note.midi_pitch_rounded - 69) / 12);
      const audibleStart = Math.max(onset, context.currentTime + 0.001);
      const remaining = offset - audibleStart;
      const attack = Math.min(0.015, remaining / 3);
      const release = Math.min(0.04, remaining / 3);
      gain.gain.setValueAtTime(0, audibleStart);
      gain.gain.linearRampToValueAtTime(0.08, audibleStart + attack);
      gain.gain.setValueAtTime(0.08, offset - release);
      gain.gain.linearRampToValueAtTime(0, offset);
      oscillator.connect(gain).connect(masterGain);
      oscillator.start(audibleStart);
      oscillator.stop(offset + 0.01);
      oscillators.push(oscillator);
    }
    if (midiPosition >= midiDuration) { pauseMidi(); midiPosition = midiDuration; }
    showPlayer();
  }
  schedule(); ticker = setInterval(schedule, 100);
  showPlayer();
}
$('song').onchange = loadSelection;
$('method').onchange = loadSelection;
$('search').oninput = refreshCatalog;
$('midiPlay').onclick = () => midiPlaying ? pauseMidi() : startMidi(false);
$('playTogether').onclick = () => { pauseMidi(); midiPosition = 0; startMidi(true); };
$('midiVolume').oninput = () => {
  midiVolume = Number($('midiVolume').value);
  if (midiVolume > 0) lastAudibleVolume = midiVolume;
  showVolume();
};
$('midiMute').onclick = () => { midiVolume = midiVolume ? 0 : lastAudibleVolume; showVolume(); };
$('midiSeek').oninput = () => { dragging = true; showPlayer(); };
$('midiSeek').onchange = () => {
  const resume = midiPlaying, syncOriginal = withOriginal;
  const position = Number($('midiSeek').value);
  pauseMidi(); dragging = false;
  midiPosition = position;
  if (resume) startMidi(syncOriginal);
  else showPlayer();
};
showVolume(); refreshCatalog(); setInterval(refreshCatalog, 10000);
</script>
</html>
