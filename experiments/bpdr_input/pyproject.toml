[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j26-bpdr-input-experiment"
version = "0.1.0"
description = "PP1 experimental workspace for Boundary-Pitch Disentangled Repair"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13", "soundfile>=0.13", "librosa>=0.11", "matplotlib>=3.9", "pesto-pitch>=1.0"]

[project.scripts]
bpdr-data-audit = "bpdr_input.inventory:main"
bpdr-process = "bpdr_input.pipeline:main"
bpdr-lab = "bpdr_input.laboratory:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]
