[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j26-bpdr-input-experiment"
version = "0.1.0"
description = "Boundary-Pitch Disentangled Repair vocal input workspace"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.13", "soundfile>=0.13", "librosa>=0.11", "matplotlib>=3.9", "pesto-pitch>=1.0"]

[project.optional-dependencies]
rendering = ["praat-parselmouth==0.4.7"]

[project.scripts]
bpdr-data-audit = "bpdr_input.preparation.sources.inventory:main"
bpdr-process = "bpdr_input.audio.pipeline:main"
bpdr-lab = "bpdr_input.preparation.pairs.laboratory:main"

[tool.setuptools.packages.find]
where = ["BPDR_Workspace/source"]

[dependency-groups]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "mido>=1.3,<2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]
presentation = [
    "streamlit>=1.40,<2",
]
